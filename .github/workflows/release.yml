name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: OpenCNCPilot-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact: OpenCNCPilot-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-glx libfontconfig1-dev

      - name: Restore
        run: dotnet restore OpenCNCPilot.Modern.sln

      - name: Publish
        run: >
          dotnet publish src/OpenCNCPilot.UI/OpenCNCPilot.UI.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/${{ matrix.rid }}

      - name: Archive (zip)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path ./publish/${{ matrix.rid }}/* -DestinationPath "${{ matrix.artifact }}-${{ github.ref_name }}.zip"
        shell: pwsh

      - name: Archive (tar.gz)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czf "${{ matrix.artifact }}-${{ github.ref_name }}.tar.gz" -C ./publish/${{ matrix.rid }} .

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}-${{ github.ref_name }}.zip
            ${{ matrix.artifact }}-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
